name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Clear needs Clang with C++23 (<print>) and LLVM 18 development packages
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18-dev libstdc++-14-dev zlib1g-dev libzstd-dev libedit-dev libcurl4-openssl-dev
        # clearc links the programs it compiles with `clang`
        sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER=clang-18
        -DCMAKE_CXX_COMPILER=clang++-18
        -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

    - name: Build
      run: cmake --build build -j

    - name: Test
      working-directory: build
      run: ctest --output-on-failure

    - name: Benchmarks (Clear vs C, informational)
      run: python3 Scripts/bench.py build/clearc Benchmarks 3

  vscode-extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install
      run: npm ci

    - name: Test
      run: npm test

    - name: Package
      run: npm run package

    - name: Upload the extension
      uses: actions/upload-artifact@v4
      with:
        name: clear-vscode-extension
        path: editors/vscode/*.vsix
