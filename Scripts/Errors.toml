[None]
Message = "An unknown error has occurred."
Advice  = "The issue occurred at {}. Please report this if unexpected."

[InvalidSyntax]
Message = "Syntax error: unexpected or invalid token."
Advice  = "‘{}’ is not recognized as valid syntax. Check for typos or missing characters."

[DivisionByZero]  
Message = "Division by zero is undefined."
Advice  = "Ensure the denominator is not zero before performing division."

[InvalidOperator]
Message = "Invalid or unsupported operator used."
Advice  = "‘{}’ is not a valid operator in this context. Check the operator or operand types."

[UnterminatedComment]
Message = "Unterminated block comment detected."
Advice  = "Make sure every ‘/*’ has a matching ‘*/’. Comment started near {}."

[UnterminatedString]
Message = "Unterminated string literal."
Advice  = "A string literal starting at ‘{}’ was not closed. Ensure all strings end with a quote."

[UnexpectedEOF]
Message = "Unexpected end of file."
Advice  = "The file ended prematurely. Check for unclosed brackets, comments, or incomplete statements."

[InvalidNumberLiteral]
Message = "Invalid numeric literal."
Advice  = "‘{}’ is not a valid number. Ensure correct syntax for integers and decimals."

[InvalidCharLiteral]
Message = "Invalid character literal."
Advice  = "A character literal starting at ‘{}’ is not valid. Ensure only one character long."

[RedefinedIdentifier]
Message = "Redefinition of identifier."
Advice  = "‘{}’ was already defined in this scope. Rename or remove the duplicate declaration."

[UndeclaredIdentifier]
Message = "Use of undeclared identifier."
Advice  = "‘{}’ is not defined in the current scope. Check for typos or missing declarations."

[TypeMismatch]
Message = "Type mismatch in assignment or operation."
Advice  = "Cannot assign or operate on incompatible types like ‘{}’. Check for implicit casts or incorrect types."

[InvalidEscapeSequence]
Message = "Invalid escape sequence in string literal."
Advice  = "‘{}’ is not a recognized escape sequence. Use sequences like \n, \t, \"."

[UnmatchedBracket]
Message = "Unmatched closing or opening bracket."
Advice  = "There is an unmatched ‘{}’."

[UnexpectedToken]
Message = "Unexpected token encountered."
Advice  = "‘{}’ was not expected here. Check for a missing operator, bracket or line break."

[ExpectedIndentation]
Message = "Expected ':' for block indentation"
Advice = "Add a colon ':' after {} to begin an indented code block"

[ExpectedNewlineAferIndentation]
Message = "Expected a new line after ':'"
Advice = "Add a line break after ':' and indent the next line to start the block"

[ExpectedIdentifier]
Message = "Expected an identifier"
Advice = "Add a valid name or identifier after {}"

[ExpectedAssignment]
Message = "Expected '=' after identifier"
Advice = "Assign a value using '=' after the identifier to complete the statement"

[ElseNotInIfBlock]
Message = "Unexpected 'else' without matching 'if'"
Advice = "Ensure 'else' is used directly after a valid 'if' or 'elif' block"

[InvalidForLoop]
Message = "Invalid 'for' loop."
Advice = "Write loops as 'for i in 0..n:', 'for i in 1..=n:' or 'for item in array:' (near ‘{}’)"

[ExpectedLeftParanFunctionDefinition]
Message = "Expected '(' after function name"
Advice = "Add '(' to begin the function’s parameter list"

[ExpectedEndOfFunction]
Message = "Expected ')' at end of parameter list"
Advice = "Close the function’s parameter list with ')'"

[ExpectedCommaBetweenFunctionParams]
Message = "Expected ',' between function parameters"
Advice = "Separate each function parameter with a comma ','"

[ExpectedFunctionReturnType]
Message = "Missing '->' for function return type"
Advice = "Add '->' followed by the return type after the parameter list"

[ExpectedEndOfScope]
Message = "Expected end of scope (e.g. end of class or function block)"
Advice = "Ensure all indented blocks are properly closed"

[ExpectedModuleName]
Message = "Expected a module name string"
Advice = "Write the file to import as a string, e.g. import \"math\" (near ‘{}’)"

[ExpectedComma]
Message = "Expected ',' between list or argument elements."
Advice  = "Separate items with a comma ',' at {} to continue the list or argument sequence."

[ExpectedColon]
Message = "Expected ':' after case label or block starter."
Advice  = "Add a colon ':' after {} to start the block or specify the case body."
[NeedsTypeOrValue]
Message = "A variable needs a type or an initial value."
Advice  = "Give ‘{}’ a type (let x: int) or a value to infer it from (let x = 0)."

[LoopControlOutsideLoop]
Message = "‘break’ or ‘continue’ used outside of a loop."
Advice  = "‘{}’ can only appear inside a while or for loop."

[VariadicNotLast]
Message = "Variadic parameter must be the last parameter."
Advice  = "Move ‘...’ to the end of the parameter list."

[ImportNotFound]
Message = "Imported file could not be found."
Advice  = "‘{}’ was not found relative to the importing file. Check the path and that it is part of the build."

[InvalidArraySize]
Message = "Array size must be a positive compile-time constant."
Advice  = "Use a literal or constant expression greater than zero for the size near ‘{}’."

[InvalidMemberAccess]
Message = "Invalid member access."
Advice  = "Only a name can follow ‘.’, near ‘{}’."

[UnknownMember]
Message = "Type has no member with this name."
Advice  = "‘{}’ is not a field or method of this type. Check the spelling or the class definition."

[MissingIndexOverload]
Message = "Type cannot be indexed."
Advice  = "Give the class ‘operator get’ (and ‘operator set’ for assignment) to support ‘[]’ near ‘{}’."

[ExpectedType]
Message = "Expected a type."
Advice  = "‘{}’ is not a type. Use a built-in type like int or float64, a class name, or a pointer such as *int."

[InvalidOperands]
Message = "Operator cannot be applied to these operand types."
Advice  = "‘{}’ is not supported. Convert one side with ‘as’ if a conversion is intended."

[ReturnTypeMismatch]
Message = "Returned value does not match the function's return type."
Advice  = "The value near ‘{}’ cannot be converted to the declared return type."

[MissingReturnValue]
Message = "Function must return a value."
Advice  = "Add a value after ‘{}’ that matches the function's return type."

[WrongArgumentCount]
Message = "Wrong number of arguments in function call."
Advice  = "‘{}."

[ArgumentTypeMismatch]
Message = "Argument type does not match the parameter type."
Advice  = "The argument near ‘{}’ cannot be converted implicitly. Use ‘as’ to convert explicitly."

[NotCallable]
Message = "Expression is not callable."
Advice  = "‘{}’ is not a function or method."

[AssignToRValue]
Message = "Cannot assign to this expression."
Advice  = "The left side near ‘{}’ must be a variable, field, dereferenced pointer or index."

[DuplicateCase]
Message = "Duplicate case value in switch."
Advice  = "The value ‘{}’ already appears in an earlier case."

[NonConstantCase]
Message = "Case values must be integer constants."
Advice  = "‘{}’ is not a compile-time integer constant."

[CannotInferGeneric]
Message = "Cannot infer the type arguments of a generic type."
Advice  = "Write the type arguments explicitly, for example ‘{}[int]’."

[ImplicitConversion]
Message = "Cannot convert implicitly, the conversion may lose information."
Advice  = "Converting ‘{}’ needs an explicit cast, for example ‘value as T’."

[NotIterable]
Message = "Value cannot be iterated over."
Advice  = "A for loop needs a range (0..n), an array, a generator, or a class with ‘operator iterate’ (or ‘operator len’ and ‘operator get’); ‘{}’ is none of these."

[ExpectedCase]
Message = "Expected ‘case’ or ‘default’ inside a switch."
Advice  = "Each branch of a switch starts with ‘case value:’ or ‘default:’, found ‘{}’."

[ConstNeedsValue]
Message = "A constant needs a value."
Advice  = "Give ‘{}’ a value: const name = value."

[AssignToConst]
Message = "Cannot change a constant."
Advice  = "‘{}’ was declared with const. Use let if it needs to change."

[InvalidEnumValue]
Message = "Enum values must be integer constants."
Advice  = "The value of ‘{}’ must be known at compile time."

[DeferOutsideFunction]
Message = "‘defer’ can only be used inside a function."
Advice  = "Move ‘{}’ into a function body."

[SwitchNotIntegral]
Message = "Switch value must be an integer or an enum."
Advice  = "‘{}’ cannot be switched on. Use if/elseif for other types."

[MissingOperatorOverload]
Message = "Operator is not defined for this class."
Advice  = "‘{}’. Define the dunder method on the class to support the operator."

[BadOperatorSignature]
Message = "Operator method has the wrong number of parameters."
Advice  = "‘{}’ must take exactly two parameters: self and the other operand."

[TooManyValues]
Message = "Too many values for this class."
Advice  = "‘{}."

[GenericMethodUnsupported]
Message = "Methods cannot have their own type parameters yet."
Advice  = "Make ‘{}’ a generic function outside the class, or make the class itself generic."

[IndexNotInteger]
Message = "Array index must be an integer."
Advice  = "‘{}’). Use ‘as’ to convert the index to an integer type."

[NoLength]
Message = "Value has no length."
Advice  = "len() works on arrays, str and classes with ‘operator len’, not ‘{}’."

[IndexOutOfRange]
Message = "Array index is out of range."
Advice  = "‘{})."

[NullDereference]
Message = "Dereferencing null."
Advice  = "‘{}’ never points at a value, so it cannot be dereferenced."

[ShiftOutOfRange]
Message = "Shift amount is out of range."
Advice  = "Shifting by ‘{})."

[LiteralOutOfRange]
Message = "Literal does not fit in the target type."
Advice  = "‘{}’. Use a wider type or an explicit ‘as’ if wrapping is intended."

[MissingReturn]
Message = "Function might end without returning a value."
Advice  = "Every path through ‘{}’ must end with a return statement."

[DestructureMismatch]
Message = "The number of names does not match the number of values."
Advice  = "Cannot unpack ‘{}."

[PositionalAfterKeyword]
Message = "A positional argument cannot follow a keyword argument."
Advice  = "Move ‘{}’ before the name = value arguments."

[UnknownKeyword]
Message = "Invalid keyword argument."
Advice  = "‘{}’."

[CannotUnpack]
Message = "Only a tuple or fixed array variable can be unpacked with ‘...’."
Advice  = "‘{}’ cannot be spread into arguments. Store it in a variable first if it is the result of a call."

[LambdaNeedsTypes]
Message = "Cannot tell the type of a lambda parameter."
Advice  = "Give ‘{}’ a type, e.g. lambda (x: int): ..., or use the lambda where a function type is expected."

[ClosureNotFunction]
Message = "A lambda that captures variables cannot be used as a plain function."
Advice  = "It carries copies of the variables it uses. Accept it with a generic parameter, e.g. function apply[F](f: F, ...), or pass the values as arguments instead."

[SwitchNotExhaustive]
Message = "Switch does not handle every case."
Advice  = "Missing: {}. Add those cases or a default."

[UnknownCase]
Message = "Not a case of this enum."
Advice  = "‘{}’."

[NeedsCaseValues]
Message = "This enum case carries data."
Advice  = "Give its values: {}(...)."

[UnionNeedsField]
Message = "A union is built from at most one field."
Advice  = "Name the field to set, e.g. {}(f = 1.5), or leave it empty for all zeros."

[InvalidBase]
Message = "A class can inherit from one class and any number of traits."
Advice  = "‘{}’ cannot be used here."

[InheritanceCycle]
Message = "A class cannot inherit from itself."
Advice  = "‘{}’ is part of a cycle of base classes."

[VirtualNeedsTable]
Message = "Virtual methods must start in a class whose base has none."
Advice  = "‘{}’ adds the first virtual method below a base class without one. Mark a method of the base virtual, or of the root class."

[TraitNotSatisfied]
Message = "Type does not satisfy the trait."
Advice  = "{}."

[NoSuperclass]
Message = "‘super’ is only available in methods of a class with a base class."
Advice  = "Only a class declared as class Name(Base) has a ‘{}’."

[PropertyNotSettable]
Message = "This property has no setter."
Advice  = "Add ‘property {}(self, value: T)’ to the class to allow assigning to it."

[MacroTooDeep]
Message = "Macro expansion is nested too deeply."
Advice  = "‘{}’ keeps expanding into itself. A macro may use other macros, but not endlessly."

[NotHashable]
Message = "This value cannot be hashed."
Advice  = "‘{}’ is not a number, pointer, enum or str. Give the class ‘operator hash(self) -> uint64’."

[YieldOutsideGenerator]
Message = "‘yield’ is only allowed in a generator."
Advice  = "Declare the function as returning Generator[T], e.g. function {}s() -> Generator[int]:"

[AwaitOutsideAsync]
Message = "‘await’ is only allowed in an async function."
Advice  = "Mark the function ‘async function’, or run the task from ordinary code with task.run() ({})."

[NotAwaitable]
Message = "Only a Task can be awaited."
Advice  = "‘{}’ is not the result of calling an async function."

[UnknownOperator]
Message = "Unknown operator."
Advice  = "‘{}."

[UseOperatorSyntax]
Message = "Special methods are written with ‘operator’."
Advice  = "‘{}’."

[VirtualNotNeeded]
Message = "‘virtual’ is not needed."
Advice  = "Methods of a class that inherits or is inherited from always run the object's own version. Remove ‘{}’."

[NotInVariant]
Message = "This type is not one of the variant's types."
Advice  = "‘{}."

[CannotCopyOwning]
Message = "This value cannot be copied."
Advice  = "‘{}’ cleans up after itself (operator destruct) and has no ‘operator copy’, so a copy would free the same thing twice. Use it in place, move it out of a local variable, or give the class an operator copy."

[OwningOperatorArgument]
Message = "An operator cannot take an owning value as a copy."
Advice  = "Declare the parameter as a pointer, e.g. ‘other: *{}’, so the operand is not moved or copied."

[UseAfterMove]
Message = "This variable was moved, so it is empty here."
Advice  = "{}. A value that can't be copied moves when it is assigned or passed. Lend it with a pointer (&x) instead, or give the variable a new value before using it again."

[MovedInLoop]
Message = "This moves a variable that the next time round the loop uses again."
Advice  = "{} is declared outside the loop, so after the first time round it would be empty. Lend it with a pointer (&x), break right after moving it, or declare it inside the loop."

[UnionOwningField]
Message = "A union cannot hold a value that needs cleaning up."
Advice  = "A union does not know which of its fields is in use, so a ‘{}’ in it would never be cleaned up. Use a variant, which remembers which type it holds."

[AssignToTemporary]
Message = "This changes a temporary value, so the change is lost."
Advice  = "This ‘{}’ is a new value that is thrown away at the end of the statement. Store it in a variable first and change that, or make the method return a pointer (*T) to change the original."

[BorrowingLambdaEscapes]
Message = "This lambda borrows local variables, so it cannot be returned."
Advice  = "It holds pointers to values that are cleaned up when this function ends. Write ‘move lambda’ to move them into the lambda instead."

[StaleElementPointer]
Message = "This pointer may point at memory that has been moved or freed."
Advice  = "{}. Adding or removing items can move all of them. Take the pointer again after the change, or store an index instead."

[ImportShadowsStandard]
Message = "This import finds a file next to this one, not the standard module of the same name."
Advice  = "{}."

[NotOptional]
Message = "This is not an optional."
Advice  = "‘{}’."

[OptionalBoolCondition]
Message = "An optional bool is ambiguous as a condition."
Advice  = "Does it mean ‘holds a value’ or ‘is true’? Write ‘x is not none’ or ‘x ?? false’."
